services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set passwords}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workflow -d workflow']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  azurite:
    image: ${AZURITE_IMAGE:-mcr.microsoft.com/azure-storage/azurite:3.35.0}
    command: azurite-blob --blobHost 0.0.0.0 --disableProductStyleUrl --location /data
    environment:
      AZURITE_ACCOUNTS: workflow:${AZURE_STORAGE_ACCOUNT_KEY:?Set AZURE_STORAGE_ACCOUNT_KEY}
    volumes: [object_data:/data]
    ports: ['127.0.0.1:10000:10000']
  mailpit:
    image: axllent/mailpit:v1.24.2@sha256:3ad9483ac2dea937ae402b95435ab12c3355d2373a1002a49491db0be536d8fa
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  clamav:
    image: clamav/clamav:stable@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamav_data:/var/lib/clamav]
  backend:
    image: workflow-creditos-backend:local
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://workflow:${POSTGRES_PASSWORD}@postgres:5432/workflow
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: azure
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=workflow;AccountKey=${AZURE_STORAGE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/workflow;"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: 'false'
      NO_PROXY: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
    volumes: ['./backend/app:/app/app:ro', './backend/alembic:/app/alembic:ro']
    command: sh -c 'alembic upgrade head && python -m app.bootstrap && python -m app.storage_init && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      azurite: {condition: service_started}
      clamav: {condition: service_started}
  worker:
    image: workflow-creditos-backend:local
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://workflow:${POSTGRES_PASSWORD}@postgres:5432/workflow
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: azure
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=workflow;AccountKey=${AZURE_STORAGE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/workflow;"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: 'false'
      NO_PROXY: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
    volumes: ['./backend/app:/app/app:ro']
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2
    depends_on:
      backend: {condition: service_started}
  beat:
    image: workflow-creditos-backend:local
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://workflow:${POSTGRES_PASSWORD}@postgres:5432/workflow
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: azure
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=workflow;AccountKey=${AZURE_STORAGE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/workflow;"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: 'false'
      NO_PROXY: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,azurite,mailpit,clamav,backend,frontend
    volumes: ['./backend/app:/app/app:ro']
    command: celery -A app.worker:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      backend: {condition: service_started}
  frontend:
    image: workflow-creditos-frontend:local
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      NO_PROXY: localhost,127.0.0.1,backend
      no_proxy: localhost,127.0.0.1,backend
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:3000']
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  object_data:
  clamav_data:
